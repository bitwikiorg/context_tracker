<svg xmlns="http://www.w3.org/2000/svg" width="960" height="290" viewBox="0 0 960 290" role="img" aria-labelledby="title desc">
<title id="title">A note can branch with the conversation</title><desc id="desc">Main holds the original note. Creating a research branch copies it. Subsequent research writes change that branch. Checking out main returns to its note.</desc>
<rect width="960" height="290" rx="16" fill="#10151f"/>
<g font-family="Arial, sans-serif"><text x="36" y="43" fill="#f5f7fc" font-size="20" font-weight="700">One note per branch. A history of revisions.</text>
<text x="36" y="106" fill="#79ded5" font-size="16">main</text><text x="36" y="205" fill="#b9adff" font-size="16">research</text>
<text x="199" y="83" fill="#c6d1e2" font-size="15">Original note</text><text x="440" y="83" fill="#c6d1e2" font-size="15">Current main note</text>
<text x="440" y="239" fill="#c6d1e2" font-size="15">Inherit note</text><text x="712" y="239" fill="#c6d1e2" font-size="15">Revise on research</text>
<text x="36" y="269" fill="#9aa9bf" font-size="14">context_checkout("main") returns to the note held by main.</text></g>
<path d="M195 110H840" stroke="#79ded5" stroke-width="3"/><path d="M310 110C380 110 380 199 450 199H840" fill="none" stroke="#b9adff" stroke-width="3"/>
<g fill="#79ded5"><circle cx="215" cy="110" r="8"/><circle cx="490" cy="110" r="8"/></g><g fill="#b9adff"><circle cx="490" cy="199" r="8"/><circle cx="760" cy="199" r="8"/></g></svg>